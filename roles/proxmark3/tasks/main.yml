---

- name: Install dependencies.
  ansible.builtin.apt:
    name: "{{ deps_packages }}"
    state: present
    update_cache: yes
  register: pkg_result
  until: pkg_result is success

- name: Clone github project.
  ansible.builtin.git:
    repo: "{{ git_url }}"
    dest: "{{ dir_path }}"
    update: yes

# Device access for /dev/ttyACM0 is handled by the shipped udev rules
# (rootfs/etc/udev/rules.d/), so 'make accessrights' is intentionally skipped.

- name: Build the default target
  community.general.make:
    chdir: "{{ dir_path }}"

- name: Run 'install' target
  community.general.make:
    chdir: "{{ dir_path }}"
    target: install

